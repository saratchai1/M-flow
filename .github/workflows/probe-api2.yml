name: Probe M-Flow API2

on:
  workflow_dispatch:
  push:
    paths:
      - "mflow_watchdog/api_checker.py"
      - "mflow_watchdog/config.py"
      - "mflow_watchdog/models.py"
      - "scripts/probe_api2.py"
      - ".github/workflows/probe-api2.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current checker
        run: pip install -e .
      - name: Validate current nonmember API with a safe empty test plate
        run: python scripts/probe_api2.py
