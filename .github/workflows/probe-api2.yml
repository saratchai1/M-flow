name: Probe M-Flow API2

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_api2.py"
      - ".github/workflows/probe-api2.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public guest flow without a real vehicle
        run: python scripts/probe_api2.py
