name: M-Flow Fleet Watchdog

on:
  workflow_dispatch:
  schedule:
    # 08:00, 12:00, 16:00, 20:00 Asia/Bangkok (GitHub cron is UTC)
    - cron: "0 1,5,9,13 * * *"

permissions:
  contents: read

concurrency:
  group: mflow-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MFLOW_HEADLESS: "true"
      VEHICLES_JSON: ${{ secrets.VEHICLES_JSON }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DATABASE_PATH: data/mflow.db
      ARTIFACT_DIR: artifacts

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium
      - name: Restore watchdog state
        uses: actions/cache/restore@v4
        with:
          path: data/mflow.db
          key: mflow-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mflow-state-
      - name: Run watchdog
        id: watchdog
        continue-on-error: true
        run: python -m mflow_watchdog.cli check
      - name: Save watchdog state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/mflow.db
          key: mflow-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mflow-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when checker needs attention
        if: steps.watchdog.outcome == 'failure'
        run: exit 1
