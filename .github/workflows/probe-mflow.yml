name: Probe M-Flow production

on:
  push:
    paths:
      - "scripts/probe_mflow.py"
      - ".github/workflows/probe-mflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.62.0
      - run: playwright install --with-deps chromium
      - run: python scripts/probe_mflow.py
      - name: Upload M-Flow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mflow-spa-probe-${{ github.run_id }}
          path: mflow-diagnostics/
          if-no-files-found: warn
          retention-days: 3
