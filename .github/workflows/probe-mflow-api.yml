name: Probe M-Flow non-member API

on:
  push:
    paths:
      - "scripts/probe_mflow_api.py"
      - ".github/workflows/probe-mflow-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_mflow_api.py
