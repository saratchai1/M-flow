name: Analyze M-Flow assets

on:
  push:
    paths:
      - "scripts/analyze_mflow_assets.py"
      - ".github/workflows/analyze-mflow-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/analyze_mflow_assets.py
