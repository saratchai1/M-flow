name: Fetch M-Flow web environment

on:
  push:
    paths:
      - "scripts/fetch_mflow_env.py"
      - ".github/workflows/fetch-mflow-env.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_mflow_env.py
