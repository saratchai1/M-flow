name: Fetch M-Flow bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-mflow-bundle.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download current public M-Flow SPA bundle
        run: |
          mkdir -p mflow-bundle
          curl --connect-timeout 15 --max-time 90 -LfsS https://mflowthai.com/mflowspf/main.dart.js -o mflow-bundle/main.dart.js
          curl --connect-timeout 15 --max-time 30 -LfsS https://mflowthai.com/mflowspf/assets/AssetManifest.bin.json -o mflow-bundle/AssetManifest.bin.json || true
          wc -c mflow-bundle/*
      - uses: actions/upload-artifact@v4
        with:
          name: mflow-bundle-${{ github.run_id }}
          path: mflow-bundle/
          retention-days: 3
